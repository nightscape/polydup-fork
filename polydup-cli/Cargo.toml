[package]
name = "polydup-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cross-language duplicate code detector CLI tool"
homepage = "https://github.com/wiesnerbernard/polydup"
repository = "https://github.com/wiesnerbernard/polydup"
readme = "../../README.md"
keywords = ["duplicate", "code", "detection", "cli", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "polydup"
path = "src/main.rs"

[dependencies]
polydup-core = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dialoguer = { workspace = true }
serde = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
atty = { workspace = true }
chrono = "0.4"

[dev-dependencies]
tempfile = "3.8"
insta = { workspace = true }
assert_cmd = "2.0"
predicates = "3.0"
